buildscript {
  // Buildscript is evaluated before everything else so we can't use getExtOrDefault.
  // Only needed when this library is opened as a standalone project; inside a host
  // app the root project provides the Android Gradle plugin and Kotlin classpath.
  def kotlin_version = rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : project.properties["MidiPlayback_kotlinVersion"]

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:7.2.1"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

def getExtOrDefault(name, fallback) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["MidiPlayback_" + name] ?: fallback)
}

def getExtOrIntegerDefault(name, fallback) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["MidiPlayback_" + name]?.toInteger() ?: fallback)
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()
  // Namespace support was added in AGP 7.3.0.
  return (major == 7 && minor >= 3) || major >= 8
}

android {
  if (supportsNamespace()) {
    namespace "com.reactnativemidiplayback"

    sourceSets {
      main {
        manifest.srcFile "src/main/AndroidManifestNew.xml"
      }
    }
  }

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion", 34)

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion", 21)
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion", 34)
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion", "1.8.0")

dependencies {
  // For < 0.71 this resolves from the local maven repo; for >= 0.71 the React
  // Native Gradle plugin replaces it with com.facebook.react:react-android:$version.
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}
